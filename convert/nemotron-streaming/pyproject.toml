[project]
name = "nemotron-convert"
version = "0.1.0"
description = "NeMo -> torch.export -> coreai_torch conversion pipeline for nvidia/nemotron-speech-streaming-en-0.6b."
requires-python = ">=3.11"
dependencies = [
    "nemo-toolkit[asr]>=2.0",
    "coreai-torch",
    "torch>=2.5,<3.0",
    "numpy",
    # coreai-optimization  # only needed for the --quantize path
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "granite-convert"
version = "0.1.0"
description = "IBM Granite Speech 4.1 2B NAR -> torch.export -> coreai_torch -> Core AI .aimodel. See ./README.md."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # Granite Speech NAR ships trust_remote_code modeling that uses
    # transformers v5-only APIs (PreTrainedConfig @strict dataclasses,
    # masking_utils.create_bidirectional_mask). Do NOT share a venv with
    # convert/cohere-transcribe, which pins <5.
    "transformers>=5.5.3,<6",
    "coreai-torch>=0.4.1",
    "torch>=2.9.1,<3.0",
    "torchaudio",               # the model's feature extractor (MelSpectrogram)
    "numpy",
    "safetensors>=0.8.0",       # coreai-opt resolves 0.7.0 otherwise; transformers 5.x needs >=0.8
    "huggingface-hub",
    "soundfile",                # reference-transcription parity runs decode audio
    "pydantic>=2.6,<2.10",      # required for the coreai_opt --quantize path
    # coreai-opt is needed for --quantize (install separately: `uv pip install --pre coreai-opt`)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
